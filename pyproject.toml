[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wut-cli"
version = "1.0.0"
description = "A modern CLI dictionary with pronunciation and bookmarking"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Devadathan M B", email = "devadathanmb@gmail.com" }]
keywords = ["dictionary", "cli", "pronunciation", "vocabulary", "bookmarks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "gtts>=2.5.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
wut = "wut.cli:main"

[project.urls]
Homepage = "https://github.com/devadathanmb/wut"
Repository = "https://github.com/devadathanmb/wut.git"
Issues = "https://github.com/devadathanmb/wut/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wut"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["wut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/wut"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "respx>=0.21.0",
    "build>=1.4.0",
    "ruff>=0.14.14",
]
